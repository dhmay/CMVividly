project:
  type: website
  output-dir: _site

website:
  title: "CMVividly"
  description: "Exploring the public T-cell response to Cytomegalorvirus."
  site-url: "https://dhmay.github.io/CMVividly"
  repo-url: "https://github.com/dhmay/CMVividly"
  repo-actions: [source, issue]
  favicon: resources/cmvividly_logo.png
  navbar:
    logo: resources/cmvividly_logo.png
    right:
      - text: "Posts"
        href: posts/index.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: "https://github.com/dhmay/CMVividly"
      - icon: linkedin
        href: "https://www.linkedin.com/in/damonhmay/"
      - icon: mortarboard-fill
        href: "https://scholar.google.com/citations?user=bDGK4S4AAAAJ"
        aria-label: "Google Scholar"
  page-footer:
    left: "&copy; 2026 Damon May &middot; CMVividly"
    center: "Exploring the public T-cell response to Cytomegalovirus"
    right:
      - icon: github
        href: "https://github.com/dhmay/CMVividly"
        aria-label: "GitHub"
      - icon: linkedin
        href: "https://www.linkedin.com/in/damonhmay/"
        aria-label: "LinkedIn"
      - icon: mortarboard-fill
        href: "https://scholar.google.com/citations?user=bDGK4S4AAAAJ"
        aria-label: "Google Scholar"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: "On this page"
    toc-depth: 4
    toc-location: right
    number-sections: true
    code-fold: true
    code-tools: true
    fig-width: 8
    fig-height: 5
    df-print: paged
    embed-resources: false

execute:
  freeze: auto
  warning: false
  message: false
