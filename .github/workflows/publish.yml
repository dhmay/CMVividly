name: Publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

#      - name: Install Python dependencies
#        run: pip install -r requirements.txt

## adding
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync Python dependencies (uv)
        run: uv sync

      - name: Cache CMV ECOcluster 2026 download
        id: cache-cmv-ecocluster-2026
        uses: actions/cache@v4
        with:
          path: data/raw/cmv_ecocluster_2026.tsv
          key: cmv-ecocluster-2026-tsv-v1

      - name: Download CMV ECOcluster 2026 dataset (if not cached)
        if: steps.cache-cmv-ecocluster-2026.outputs.cache-hit != 'true'
        run: uv run python -c "from cmvividly.data.access import load_cmv_ecocluster_2026; load_cmv_ecocluster_2026()"

      - name: Cache CMV ECOcluster 2024 download
        id: cache-cmv-ecocluster-2024
        uses: actions/cache@v4
        with:
          path: data/raw/cmv_ecocluster_2024.tsv
          key: cmv-ecocluster-2024-tsv-v1

      - name: Download CMV ECOcluster 2024 dataset (if not cached)
        if: steps.cache-cmv-ecocluster-2024.outputs.cache-hit != 'true'
        run: uv run python -c "from cmvividly.data.access import load_cmv_ecocluster_2024; load_cmv_ecocluster_2024()"

      - name: Render site (uv env)
        run: uv run quarto render
## end adding

      - name: Stage built site at artifact root
        run: |
          rm -rf pages-site
          mkdir pages-site
          cp -R _site/. pages-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Verify build output exists
        run: test -f _site/index.html


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
