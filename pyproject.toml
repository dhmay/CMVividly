[project]
name = "cmvividly"
version = "0.1.0"
description = "Analyzing the CMV ECOcluster."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.2,<4.3",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "seaborn>=0.13.2",
    "plotly>=6.9.0",
    "altair>=6.2.2",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "requests>=2.34.2",
    "tqdm>=4.68.4",
    "python-dotenv>=1.2.2",
    "polars>=1.42.1",
    "duckdb>=1.5.4",
    "dask>=2026.7.0",
    "distributed>=2026.7.0",
    "itables>=2.9.1",
    "nodeenv==1.10.0",
    "pip==25.0.1",
    "pyright==1.1.411",
    "jupyterlab-extensions==0.0.1",
    "jupyter-copilot==0.1.5",
    "matplotlib-venn>=1.1.2",
    "networkx>=3.6.1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
