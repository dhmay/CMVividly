[project]
name = "data-analysis-series"
version = "0.1.0"
description = "A reproducible Python + Quarto data analysis series."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "seaborn>=0.13.2",
    "plotly>=6.9.0",
    "altair>=6.2.2",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "requests>=2.34.2",
    "tqdm>=4.68.4",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
